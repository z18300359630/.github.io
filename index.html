<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>西兰花 · 个人主页</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b,#14532d);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.card{
    width:850px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:30px;
    padding:50px;
    color:white;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.top{
    display:flex;
    align-items:center;
    gap:30px;
    margin-bottom:40px;
}

.avatar{
    width:140px;
    height:140px;
    border-radius:50%;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:70px;
    box-shadow:0 10px 30px rgba(34,197,94,.5);
}

.info h1{
    font-size:42px;
    margin-bottom:10px;
}

.info p{
    opacity:.8;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.box{
    background:rgba(255,255,255,.06);
    padding:25px;
    border-radius:20px;
}

.box h2{
    color:#4ade80;
    margin-bottom:15px;
}

.contact{
    margin-top:30px;
    padding:20px;
    background:rgba(34,197,94,.15);
    border-radius:18px;
}

.tag{
    display:inline-block;
    padding:8px 16px;
    background:#22c55e;
    border-radius:999px;
    margin-top:10px;
}
</style>

</head>

<body>

<div class="card">

<div class="top">

<div class="avatar">
🥦
</div>

<div class="info">
<h1>西兰花</h1>
<p>蔬菜界传奇人物</p>
</div>

</div>

<div class="grid">

<div class="box">
<h2>🥬 技能</h2>

<div class="tag">
蔬菜大王
</div>

</div>

<div class="box">
<h2>📂 项目</h2>

<p>
把梨曦澄艹晕古（7）群主
</p>

</div>

</div>

<div class="contact">

<h2>📞 联系方式</h2>

<p>
12345678
</p>

</div>

</div>

</body>
</html>
